# Governance + cost rules (case-insensitive JS regex).
providers:
  openai: '\bopenai\b|api\.openai\.com|from openai import|require\(["'']openai'
  anthropic: '\banthropic\b|api\.anthropic\.com|@anthropic-ai/sdk'
  google_gemini: '\bgemini\b|generativelanguage\.googleapis|@google/generative-ai|google\.genai'
  azure_openai: '\bazure[-_ ]?openai\b|openai\.azure\.com'
  aws_bedrock: '\bbedrock\b'
  mistral: '\bmistral(ai)?\b'
  cohere: '\bcohere\b'
  groq: '\bgroq\b'
  xai: '\bx\.ai\b|\bxai\b|\bgrok-\d'
  ollama_local: '\bollama\b'
  openrouter: '\bopenrouter\b'
frameworks:
  langchain: '\blangchain\b'
  langgraph: '\blanggraph\b'
  llamaindex: '\bllama_?index\b'
  crewai: '\bcrewai\b'
  autogen: '\bautogen\b'
  vercel_ai_sdk: '["'']ai["'']|@ai-sdk/'
  openai_agents: 'openai-agents|from agents import'
  mcp: '\bmcpServers\b|@modelcontextprotocol|\bFastMCP\b'
model_ref: '\b(gpt-[0-9][\w.-]*|o[134](-mini|-pro)?(-\d{4}-\d{2}-\d{2})?|claude-[\w.-]+|gemini-[\w.-]+|grok-[\w.-]+|llama[-\d][\w.-]*|mistral-[\w.-]+|command-r[\w.-]*)\b'
pinned_model: '-\d{4}-?\d{2}-?\d{2}\b|-\d{8}\b|@\d{8}|-\d{3}$'
alias_model: '-latest\b|^gpt-4o$|^gpt-4$|^claude-3-opus$'
expensive_model: '\b(gpt-4(\.5)?|gpt-4-turbo|o1(-pro)?|o3(-pro)?|claude-[\w.-]*opus[\w.-]*|gemini-[\d.]+-ultra)\b'
llm_call: '\.(chat\.)?completions\.create\(|\.messages\.create\(|\.responses\.create\(|generateContent\(|generateText\(|streamText\(|\.invoke\(|ChatOpenAI\(|ChatAnthropic\('
max_tokens: '\bmax_(output_)?tokens\b|\bmaxTokens\b|\bmax_completion_tokens\b|\bmaxOutputTokens\b'
timeout: '\btimeout\b|\brequest_timeout\b|AbortSignal\.timeout|\bdeadline\b'
retry_cap: '\bmax_?retries\b|\bmaxRetries\b|\bretry[_ -]?(limit|max|attempts)\b|\bstop_after_attempt\b|\bbackoff\b'
recursion_cap: '\brecursion_?limit\b|\bmax_?(iterations|iter|steps|turns|loops|depth)\b|\bmaxSteps\b|\bstopWhen\b|\bmaxTurns\b'
loop_risk: 'while\s*\(\s*true\s*\)|while\s+True\s*:|for\s*\(\s*;\s*;\s*\)'
budget: '\bbudget\b|\bspend[_ -]?(limit|cap|alert)|\busage[_ -]?(limit|alert|cap)|\bcost[_ -]?(alert|cap|limit)|\bbilling[_ -]?alert|\bhard[_ -]?limit'
tracing: '\bopentelemetry\b|\botel\b|\botlp\b|\blangsmith\b|LANGCHAIN_TRACING|\blangfuse\b|\bhelicone\b|\bphoenix\b|\bweave\b|\btraceloop\b'
logging: '\blogger\.|\blogging\.|console\.(log|info|warn|error)\(|\bpino\b|\bwinston\b'
owner_doc: '\b(owner|maintainer|contact|on[-_ ]?call|responsible)\s*[:=]'
review_doc: '\b(reviewed|approved)[_ -]?(by|on)\b|\breview[_ -]?(date|log|process)\b|\bchange[_ -]?log\b'
