# ADSF: all-document scan for prompt injection. Case-insensitive JS regex. Edit freely.
instructions:
  - id: ignore_previous
    severity: high
    pattern: '\b(ignore|disregard|forget|override)\b[^.\n]{0,40}\b(all |any )?(previous|prior|above|earlier|preceding|system)\b[^.\n]{0,20}\b(instructions?|prompts?|rules?|messages?|directions?)\b'
    message: '"Ignore previous instructions" style override.'
  - id: role_reassign
    severity: high
    pattern: '\b(you are now|from now on,? you are|act as (an? )?(unrestricted|jailbroken|developer mode)|enter (developer|god|dan) mode|new (system )?instructions?:)'
    message: Tries to reassign the agent's role or rules.
  - id: fake_system
    severity: high
    pattern: '(^|\n)\s*(\[?(system|assistant)\]?\s*:|<\|?(system|im_start)\|?>|###\s*(system|instruction)|<\/?system>)'
    message: Fake system/assistant marker inside content.
  - id: hidden_task
    severity: high
    pattern: '\b(ai|assistant|agent|llm|model|chatbot)s?\b[^.\n]{0,30}\b(reading|processing|summari[sz]ing)\b[^.\n]{0,30}\b(must|should|need to|are instructed to)\b'
    message: Instruction addressed to an AI reading the document.
  - id: secrecy
    severity: medium
    pattern: '\b(do not|don''t|never) (tell|mention|reveal|inform|alert) (the )?(user|human|operator|anyone)\b'
    message: Asks the agent to hide something from the user.
  - id: exfil_instruction
    severity: high
    pattern: '\b(send|post|forward|upload|email|leak|include)\b[^.\n]{0,50}\b(api[_ -]?keys?|passwords?|tokens?|credentials?|secrets?|conversation|chat history|system prompt|env(ironment)? variables?|\.env|cookies?)\b[^.\n]{0,40}\b(to|at)\b'
    message: Instruction to send secrets or conversation data somewhere.
  - id: tool_call_injection
    severity: high
    pattern: '\b(call|run|execute|invoke|use) (the )?(tool|function)\b[^.\n]{0,30}\b(send_|delete_|transfer|pay|submit|shell|exec|curl|wget)'
    message: Asks the agent to call a risky tool.
exfil_links:
  - id: md_image_exfil
    severity: high
    pattern: '!\[[^\]]*\]\(https?://[^)\s]*[?&][^)\s]*(\{\{|\$\{|%7B%7B|\[[A-Z_]+\]|<[A-Z_]+>|data=|q=|secret|token|key)'
    message: Markdown image whose URL carries data. Rendering it can leak data with no click.
  - id: templated_url
    severity: high
    pattern: 'https?://[^\s"''<>)]*(\{\{[^}]+\}\}|\$\{[^}]+\}|%7B%7B)'
    message: URL with a template slot for the agent to fill in.
  - id: webhook_catcher
    severity: medium
    pattern: 'https?://[^\s"''<>)]*(webhook\.site|requestbin|pipedream\.net|ngrok(-free)?\.(io|app)|burpcollaborator|interact\.sh|oast\.(fun|me|pro)|beeceptor)'
    message: Known request-capture host.
hidden_text:
  - id: html_comment_instruction
    severity: high
    pattern: '<!--[\s\S]{0,400}?\b(ignore|instruction|assistant|ai agent|system prompt|you must|you are|send|reveal)\b[\s\S]{0,400}?-->'
    message: HTML comment containing instructions (invisible when rendered).
  - id: css_hidden
    severity: medium
    pattern: '(display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0(px)?\b|opacity\s*:\s*0(\.0+)?\b|color\s*:\s*(#fff(fff)?|white)\b[^"]{0,40}background(-color)?\s*:\s*(#fff(fff)?|white))'
    message: CSS that hides text from people but not from an agent.
  - id: data_uri
    severity: low
    pattern: 'data:(text\/(html|plain)|application\/(json|javascript))[;,][^\s"'')]{20,}'
    message: Inline data URI with text content.
# Derived from Microsoft LLMail-Inject (MIT). Regenerate stats with scripts/import-llmail.mjs; see docs/LLMAIL_BENCHMARK.md.
llmail:
  - id: llmail_tool_call_syntax
    severity: high
    family: tool-call / send_email exfiltration
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '(\bapi[_ ]?call\b|\bsend_?e?mail\s*\(|\bsendmail\s*\(|\bcall_?tool\b|\btool_?call\b\s*[:(=>-]|"function"\s*:\s*\{\s*"name"|\bsend_email\b[^.\n]{0,40}\b(to|destination|recipient)\b)'
    message: Text spells out a tool or API call (e.g. send_email) for the agent to run. Common LLMail-Inject attack shape.
  - id: llmail_fake_turn_delimiter
    severity: high
    family: fake system/user turn delimiters
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '(<<\s*(end|start|begin)_?(context|prompt|program|user_query|query)\s*>>|<\/?\s*(user_query|user_session|assistant_task|end_summari[sz]ation_session|start_session|end_session|start_user_session|user_instructions?)\b[^>]{0,80}>|<\|\s*(end|user|assistant|im_end|im_start|eot_id|start_header_id|(begin|end|start)[ _][a-z ]{2,20})\s*\|>|<\/?(email|user|assistant|system prompt|developer|tool|tool_output|documents)>|\[\s*(end|start) (user|system|email)[ _]?(input|query|context|instructions?)?\s*\]|\b(END_EMAIL_CONTEXT|END_USER_SESSION|START_USER_SESSION|NEW_USER_SESSION|NEXT_INSTRUCTION|END_QUERY|TEXT_OVER|USERQUERY|PROCESS_USER_QUERY)\b|>>\}\}\]\]\)\)|\[\s*internal (ai )?instructions?\b)'
    message: Fake end-of-data or new user/system turn marker that tries to break out of the email/document context.
  - id: llmail_obfuscated_address
    severity: medium
    family: encoded / obfuscated instructions
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '\b[a-z0-9._-]+\s*(\[at\]|\(at\)|<at>|\{at\}|\s+at\s+)\s*[a-z0-9-]+\s*(\[dot\]|\(dot\)|<dot>|\{dot\}|\s+dot\s+)\s*(com|net|org|io)\b'
    message: Email address written in obfuscated form (name [at] domain [dot] com), often used to slip past filters.
  - id: llmail_deobfuscate_instruction
    severity: high
    family: encoded / obfuscated instructions
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '\b((remove|delete|strip|ignore) (all|every|the)( of the)? ["''“]?[^\s"''”]{1,12}["''”]?( (signs?|characters?|words?|tokens?|symbols?))?( from (this|the) (text|message|email))? (and|then) (run|execute|send|follow|do)|every (second|other|third) word\b|read (it|this|the text|the message) backwards|(decode|deobfuscate|reverse) (the|this) (following|message|text|instructions?) (and|then) (run|execute|follow|send|do))'
    message: Asks the agent to decode or de-obfuscate hidden text and then act on it.
  - id: llmail_post_task_trigger
    severity: high
    family: tool-call / send_email exfiltration
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '\b(after|once|when) (you(''ve| have)? )?(finish(ed)? )?(summari[sz](e|es|ed|ing)|reading|processing)\b[^.\n]{0,60}\b(send|e-?mail|forward|notify|call|post)\b|\binstead of (summari[sz](ing|e)|the summary)\b'
    message: Piggy-backs an extra action onto the agent's real task ("after summarizing, send...").
  - id: llmail_send_directive
    severity: medium
    family: tool-call / send_email exfiltration
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '\b(send|compose|draft and send|shoot|drop|fire off|dispatch|issue)\b[^.\n]{0,40}\b(e-?mail|message|mail|notification|reply)\b[^.\n]{0,60}\b(body|content|text|containing|saying|with the (word|text))\b[^.\n]{0,40}\b(to|destination|recipient)\b|\b(destination|recipient|to|e-?mail)["'']?\s*[=:]\s*["''(]?[a-z0-9._-]+@[a-z0-9.-]+[^\n]{0,40}\bbody["'']?\s*[=:]'
    message: Instruction to send an email with a specific recipient and body. In untrusted content this is the classic indirect-injection goal.
  - id: llmail_encoded_text
    severity: medium
    family: encoded / obfuscated instructions
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '((\\u|u\+|\bU\+?)[0-9a-f]{4}[\s,]*){12,}|(\b[a-z] ){15,}|(%[0-9a-f]{2}){12,}|(\b[01]{8}\s+){8,}'
    message: Long run of encoded or letter-spaced text (Unicode escapes, s p a c e d letters, URL or binary encoding) that may hide instructions.
  - id: llmail_send_to_address
    severity: low
    family: tool-call / send_email exfiltration
    source: LLMail-Inject (microsoft/llmail-inject-challenge, MIT)
    pattern: '\b(send|reply|submit|forward|e-?mail|mail|confirm)\b[^.\n]{0,60}\bto:?\s*["''(`]?[a-z0-9._+-]+@[a-z0-9-]+\.[a-z]{2,}'
    message: 'Low-confidence signal: text asks the reader to send something to a specific address. Normal in human email; worth a look when the reader is an agent with a send tool.'
