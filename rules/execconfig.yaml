# Execution-config rules: agent code that can write files a LATER run (the agent harness, the IDE, CI, git, the
# shell) reads or executes. Case-insensitive JS regex, matched per line. STATIC ONLY: these rules read files in the
# scanned folder. They cannot see what an agent writes at runtime or outside the folder. Treat every finding as
# "check this path", not as proof.
#
# Severity is for code and config. Matches in documentation (.md/.txt/.rst, notebook markdown) and in test files
# are lowered to low. Comment lines are skipped.

sources:
  ms_cve_2026_103572: >-
    Microsoft Patch Tuesday, CVE-2026-103572 (CVSS 8.8), as described by Embrace The Red on 2026-10-13
    (https://embracethered.com/blog/posts/2026/visual-studio-copilot-remote-code-execution/): Copilot in Visual
    Studio/SSMS could write to its own settings and configuration files and reach command execution; a trailing dot
    (".mcp.json.") got past the protected-file check. Their description, not ours; exploit steps are not reproduced here.
  arxiv_2610_15137: >-
    arXiv 2610.15137 (https://arxiv.org/abs/2610.15137), their finding, not ours: in 20 public repos, 296 of 542
    commits (54.6%) that change a file the run reads leave the approved file untouched.

# Files an agent harness, IDE, CI system, git or shell reads or runs later. Two tiers.
exec_targets: '(\.mcp\.json|(^|[^\w])mcp\.json|mcp_config\.json|claude_desktop_config\.json|\.vscode[/\\]+(settings|tasks|launch|mcp)\.json|\.cursor[/\\]+(mcp\.json|hooks)|\.claude[/\\]+(settings(\.local)?\.json|hooks|commands|agents)|\.codex[/\\]+config\.toml|\.gemini[/\\]+settings\.json|\.github[/\\]+workflows|\.git[/\\]+hooks|\.husky[/\\]|\.pre-commit-config\.ya?ml|(^|[^\w.])\.(bash|zsh)rc\b|\.bash_profile\b|\.zprofile\b|\.envrc\b|\.devcontainer[/\\]|sitecustomize\.py|usercustomize\.py)'
instruction_targets: '(AGENTS\.md|CLAUDE\.md|GEMINI\.md|\.cursorrules|\.windsurfrules|\.clinerules|copilot-instructions\.md|\.instructions\.md|\.prompt\.md|\.cursor[/\\]+rules|SKILL\.md)'
# A write on the same line (or on a later line that uses a variable assigned to one of the targets above).
write_verbs: '(\bopen\s*\([^)]*,\s*(mode\s*=\s*)?["''](w|a|x|r\+|w\+|a\+)b?["'']|\.write_text\s*\(|\.write_bytes\s*\(|\bwriteFile(Sync)?\s*\(|\bappendFile(Sync)?\s*\(|createWriteStream\s*\(|\bshutil\.(copy2?|copyfile|move)\s*\(|\bos\.(replace|rename)\s*\(|\bfs\.(rename|copyFile)(Sync)?\s*\(|\bsed\s+-i\b|\btee\s+(-a\s+)?)'
# Signs a write tool limits where it can write. Searched in the tool's body.
path_guards: '(allow(ed)?[_-]?(paths?|dirs?|roots?|list)|allowlist|whitelist|is_relative_to|commonpath|relative_to\s*\(|path\.relative\s*\(|\.startswith\s*\(|\.startsWith\s*\(|realpath|safe_?(join|path)|sandbox|workspace_?(root|dir)|protected|deny|forbidden|blocked_?paths)'
# Write tool definitions (names). Python decorators are looked for in the 4 lines above a def.
write_tool_names: '(write_?file|edit_?file|create_?file|save_?file|append_?file|file_?write|str_replace_editor|str_replace_based_edit_tool|apply_?patch|write_to_file|overwrite_?file)'
tool_markers: '(@(\w+\.)*(tool|function_tool)\b|server\.(tool|registerTool)\s*\(|\bname\s*(:[^=\n]*)?=\s*|\bname\s*:\s*["'']|"name"\s*:\s*["'']|def\s+)'

rules:
  - id: auto_run_setting
    severity: medium
    family: settings that run things without asking
    source: ms_cve_2026_103572
    pattern: '"enableAllProjectMcpServers"\s*:\s*true|"chat\.tools\.(global\.)?autoApprove"\s*:\s*true|"task\.allowAutomaticTasks"\s*:\s*"on"|"runOn"\s*:\s*"folderOpen"|--dangerously-skip-permissions|"defaultMode"\s*:\s*"bypassPermissions"|"autoApprove"\s*:\s*\[\s*"\*"'
    message: A setting that starts tools, MCP servers or tasks without asking. If an agent can edit this file, it can change what runs next time.

# --lock / --verify-lock: files hashed into .agent-ops-lock.json (path relative to the scanned folder, "/" separators).
# Matched against the path with trailing dots and spaces removed from each name, so ".mcp.json." is still ".mcp.json".
lock_files: '(^|/)(\.mcp\.json|mcp\.json|mcp_config\.json|claude_desktop_config\.json|AGENTS\.md|CLAUDE\.md|CLAUDE\.local\.md|GEMINI\.md|SKILL\.md|\.cursorrules|\.windsurfrules|\.clinerules|package\.json|pyproject\.toml|Makefile|makefile|GNUmakefile|justfile|\.pre-commit-config\.ya?ml|\.envrc|\.bashrc|\.zshrc|\.bash_profile|\.zprofile|\.profile|sitecustomize\.py|usercustomize\.py|[^/]*\.prompt\.md|[^/]*\.instructions\.md|system[_-]?prompt\.(md|txt))$|(^|/)\.vscode/(settings|tasks|launch|mcp)\.json$|(^|/)\.github/(workflows/[^/]+\.ya?ml|copilot-instructions\.md|instructions/.+|prompts/.+|hooks/.+)$|(^|/)\.(claude|cursor|codex|gemini|windsurf|clinerules|husky|devcontainer)/.+|(^|/)\.git/hooks/[^/]+$'
lock_skip: '(^|/)\.git/hooks/[^/]+\.sample$|(^|/)(node_modules|\.venv|venv|dist|build|__pycache__)/'
